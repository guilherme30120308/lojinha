<html>
    <body>
<h2>Cadastro de Usuário</h2>
<form action="insert_usuario.php" method="POST">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="cpf" placeholder="CPF" maxlength="11" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Endereço</h2>
<form action="insert_endereco.php" method="POST">
    <input type="text" name="rua" placeholder="Rua" required>
    <input type="number" name="numero" placeholder="Numero" required>
    <input type="text" name="bairro" placeholder="Bairro" required>
    <input type="text" name="cidade" placeholder="Cidade" required>
    <input type="text" name="estado" placeholder="Estado" required>
    <input type="text" name="pais" placeholder="Pais" required>
    <input type="number" name="id_usuario" placeholder="ID Usuario" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Fornecedor</h2>
<form action="insert_fornecedor.php" method="POST">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="text" name="cnpj" placeholder="CNPJ" maxlength="14" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="telefone" placeholder="Telefone" maxlength="11" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Produto</h2>
<form action="insert_produto.php" method="POST">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="number" name="quantidade" placeholder="Quantidade" min="0" required>
    <input type="number" name="preco" placeholder="Preco" step="0.01" required>
    <input type="text" name="categoria" placeholder="Categoria">
    <input type="number" name="id_fornecedor" placeholder="ID Fornecedor" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Pedido</h2>
<form action="insert_pedido.php" method="POST">
    <input type="date" name="data_pedido" required>
    <input type="number" name="quant" placeholder="Quantidade" required>
    <input type="number" name="id_endereco" placeholder="ID Endereco" required>
    <input type="number" name="id_usuario" placeholder="ID Usuario" required>
    <button type="submit">Cadastrar</button>
</form>
<h2>Cadastro da Transportadora</h2>
<form action="insert_transportadora.php" method="POST">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="text" name="cnpj" placeholder="CNPJ" required>
    <input type="text" name="telefone" placeholder="Telefone" required>
    <input type="text" name="email" placeholder="Email" required>
    <input type="date" name="prazo_entrega" required>
    <button type="submit">Cadastrar</button>
</form>
    </body>
</html>
