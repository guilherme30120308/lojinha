<html>
    <body>

<h2>Cadastro de Usuario</h2>

<form action="insert_usuario.php" method="POST" style="display:inline;">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="cpf" placeholder="CPF" maxlength="14" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Endereco</h2>

<form action="insert_endereco.php" method="POST" style="display:inline;">
    <input type="text" name="rua" placeholder="Rua" required>
    <input type="number" name="numero" placeholder="Numero" min="1" required>
    <input type="text" name="bairro" placeholder="Bairro" required>
    <input type="text" name="cidade" placeholder="Cidade" required>
    <input type="text" name="estado" placeholder="Estado" required>
    <input type="text" name="pais" placeholder="Pais" required>
    <input type="number" name="id_usuario" placeholder="ID Usuario" min="1" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Fornecedor</h2>

<form action="insert_fornecedor.php" method="POST" style="display:inline;">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="text" name="cnpj" placeholder="CNPJ" maxlength="18" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="telefone" placeholder="Telefone" maxlength="15" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Produto</h2>

<form action="insert_produto.php" method="POST" style="display:inline;">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="number" name="quantidade" placeholder="Quantidade" min="0" required>
    <input type="number" name="preco" placeholder="Preco" min="0.01" step="0.01" required>
    <input type="text" name="categoria" placeholder="Categoria">
    <input type="number" name="id_fornecedor" placeholder="ID Fornecedor" min="1" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro da Transportadora</h2>

<form action="insert_transportadora.php" method="POST" style="display:inline;">
    <input type="text" name="nome" placeholder="Nome" required>
    <input type="text" name="cnpj" placeholder="CNPJ" maxlength="18" required>
    <input type="text" name="telefone" placeholder="Telefone" maxlength="15" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="date" name="prazo_entrega" required>
    <button type="submit">Cadastrar</button>
</form>

<h2>Cadastro de Pedido</h2>

<form action="insert_pedido.php" method="POST" style="display:inline;">
    <input type="date" name="data_pedido" required>
    <input type="number" name="quant" placeholder="Quantidade" min="1" required>
    <input type="number" name="id_endereco" placeholder="ID Endereco" min="1" required>
    <input type="number" name="id_usuario" placeholder="ID Usuario" min="1" required>
    <input type="number" name="id_transportadora" placeholder="ID Transportadora" min="1" required>
    <button type="submit">Cadastrar</button>
</form>
    </body>
</html>
